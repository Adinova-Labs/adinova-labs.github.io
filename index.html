<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adinova Labs | Cyber Lab</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hud-navbar">
    <div class="hud-left">
        <img src="logo.png" alt="Adinova Logo" class="hud-logo">
    </div>

    <div class="hud-center">
        <span class="hud-title">Adinova Labs</span>
    </div>

    <nav class="hud-right">
        <a href="#">Home</a>
        <a href="#">Apps</a>
        <a href="#">Games</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="cyber-hero">
  <div class="cyber-container">

    <div class="cyber-circle">
      <img src="cyber-samurai.png" alt="">
    </div>

    <h1 class="cyber-title">
      Crafting the Future of <span>Interactive Worlds</span>
    </h1>

    <p class="cyber-subtitle">
      Futuristic cyber lab developing next-gen mobile apps and immersive game worlds.
    </p>

    <div class="cyber-buttons">
      <a href="#" class="btn-primary">Explore Projects</a>
      <a href="#" class="btn-outline">Enter The Lab</a>
    </div>

    <div class="stat-row">
      <div class="stat-box">
        <h3>120K+</h3>
        <p>Active Users</p>
      </div>
      <div class="stat-box">
        <h3>8+</h3>
        <p>Digital Products</p>
      </div>
      <div class="stat-box">
        <h3>Global</h3>
        <p>Independent Studio</p>
      </div>
    </div>

  </div>
</section>
</body>
</html>
