<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adinova Labs | Cyber Lab</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="cyber-hero">

  <div class="cyber-frame">

    <header class="cyber-nav">
      <div class="cyber-logo">Adinova Labs</div>

      <nav class="cyber-menu">
        <a href="#">Home</a>
        <a href="#">Apps</a>
        <a href="#">Games</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <div class="cyber-content">

      <div class="cyber-center">
        <div class="ring"></div>
        <img src="adinovalogo.png" class="center-logo">
      </div>

      <div class="cyber-text">
        <h1>Crafting the Future of <span>Interactive Worlds</span></h1>
        <p>Futuristic cyber lab developing next-gen mobile apps and immersive game worlds.</p>

        <div class="cyber-buttons">
          <a href="#" class="btn-neon">Explore Projects</a>
          <a href="#" class="btn-outline-neon">Enter The Lab</a>
        </div>
      </div>

      <div class="cyber-stats">
        <h3>Studio Active</h3>
        <div class="status">● Online</div>

        <div class="stat-grid">
          <div><strong>8+</strong><span>Apps</span></div>
          <div><strong>500K+</strong><span>Users</span></div>
        </div>

        <p class="since">Since 2025</p>
      </div>

    </div>

  </div>

</section>


</body>
</html>
